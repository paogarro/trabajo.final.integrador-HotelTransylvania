{% extends "base/base.html" %}

{% block title %}Editar reserva | Hotel Transylvania{% endblock %}

{% block content %}
<section class="page-heading"><div><p class="eyebrow">Estadías</p><h1>Editar reserva</h1><p class="subtitle">Actualizá los datos de la reserva de {{ object.cliente }}.</p></div></section>
<section class="form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions"><button class="button" type="submit">Guardar cambios</button><a class="button secondary" href="{% url 'reserva:reserva_list' %}">Cancelar</a></div>
    </form>
</section>
{% endblock %}
