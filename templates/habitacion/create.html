{% extends "base/base.html" %}

{% block title %}Nueva habitación | Hotel Transylvania{% endblock %}

{% block content %}
<section class="page-heading"><div><p class="eyebrow">Alojamiento</p><h1>Nueva habitación</h1><p class="subtitle">Completá la información y asigná un hotel.</p></div></section>
<section class="form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions"><button class="button" type="submit">Guardar habitación</button><a class="button secondary" href="{% url 'habitacion:habitacion_list' %}">Cancelar</a></div>
    </form>
</section>
{% endblock %}
