{% extends "base/base.html" %}

{% block title %}Eliminar actividad | Hotel Transylvania{% endblock %}

{% block content %}
<section class="page-heading"><div><p class="eyebrow">Experiencias</p><h1>Eliminar actividad</h1></div></section>
<section class="form-card">
    <p class="confirm-copy">¿Seguro que querés eliminar la actividad <strong>{{ object.nombre }}</strong>? Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions"><button class="button danger" type="submit">Sí, eliminar</button><a class="button secondary" href="{% url 'actividad_turistica:actividad_turistica_list' %}">No, volver</a></div>
    </form>
</section>
{% endblock %}
